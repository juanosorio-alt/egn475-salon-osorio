{% extends "base.html" %}

{% block title %}{{ service.name }} | Bella Vista Salon{% endblock %}

{% block content %}
  <h1>{{ service.name }}</h1>
  <p>{{ service.description }}</p>
  <p><strong>${{ "%.2f"|format(service.price_cents / 100) }}</strong></p>
  <p>{{ service.duration_minutes }} minutes</p>
  <a href="{{ url_for('services') }}">Back to Services</a>
{% endblock %}
