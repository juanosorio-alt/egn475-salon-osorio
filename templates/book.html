{% extends "base.html" %}

{% block title %}Book an Appointment | Bella Vista Salon{% endblock %}

{% block content %}
  <h1>Book an Appointment</h1>

  {% if errors %}
    <div role="alert">
      {% for error in errors %}
        <p>{{ error }}</p>
      {% endfor %}
    </div>
  {% endif %}

  <form method="post" action="{{ url_for('book') }}">
    <label for="client_name">Client name</label>
    <input id="client_name" name="client_name" type="text"
           value="{{ form_values.client_name }}" required>

    <label for="service_id">Service</label>
    <select id="service_id" name="service_id" required>
      <option value="" {% if not form_values.service_id %}selected{% endif %}>Choose a service</option>
      {% if form_values.service_id and form_values.service_id not in available_service_ids %}
        <option value="{{ form_values.service_id }}" selected>
          Unavailable service ({{ form_values.service_id }})
        </option>
      {% endif %}
      {% for service in services %}
        <option value="{{ service.id }}"
                {% if form_values.service_id == service.id|string %}selected{% endif %}>
          {{ service.name }} — ${{ "%.2f"|format(service.price_cents / 100) }}
        </option>
      {% endfor %}
    </select>

    <label for="date">Date (YYYY-MM-DD)</label>
    <input id="date" name="date" type="text" inputmode="numeric"
           placeholder="YYYY-MM-DD" value="{{ form_values.date }}" required>

    <label for="time">Time (HH:MM, 09:00–17:30)</label>
    <input id="time" name="time" type="text" inputmode="numeric"
           placeholder="HH:MM" value="{{ form_values.time }}" required>

    <label for="notes">Notes (optional)</label>
    <textarea id="notes" name="notes">{{ form_values.notes }}</textarea>

    <button type="submit">Submit Request</button>
  </form>

  <a href="{{ url_for('services') }}">Back to Services</a>
{% endblock %}
